[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quotemux-packages"
version = "0.1.0"
description = "QuoteMux source packages"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
packages = ["quotemux_packages", "quotemux_packages.akshare", "quotemux_packages.cninfo_evidence", "quotemux_packages.crawler_provider", "quotemux_packages.derived_core", "quotemux_packages.eastmoney_official", "quotemux_packages.efinance", "quotemux_packages.mootdx", "quotemux_packages.opentdx", "quotemux_packages.shinny_edb", "quotemux_packages.shinny_tqsdk", "quotemux_packages.tushare"]
package-dir = {"quotemux_packages" = "packages"}

[tool.setuptools.package-data]
quotemux_packages = ["py.typed"]
"quotemux_packages.akshare" = ["quotemux_package.json", "requirements.txt"]
"quotemux_packages.cninfo_evidence" = ["quotemux_package.json"]
"quotemux_packages.crawler_provider" = ["quotemux_package.json", "requirements.txt"]
"quotemux_packages.derived_core" = ["quotemux_package.json", "requirements.txt"]
"quotemux_packages.eastmoney_official" = ["quotemux_package.json"]
"quotemux_packages.efinance" = ["quotemux_package.json", "requirements.txt"]
"quotemux_packages.mootdx" = ["quotemux_package.json", "requirements.txt"]
"quotemux_packages.opentdx" = ["quotemux_package.json", "requirements.txt"]
"quotemux_packages.shinny_edb" = ["quotemux_package.json", "requirements.txt"]
"quotemux_packages.shinny_tqsdk" = ["quotemux_package.json", "requirements.txt", "README.md"]
"quotemux_packages.tushare" = ["quotemux_package.json", "requirements.txt"]
